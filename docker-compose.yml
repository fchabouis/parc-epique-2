# Base de données de développement : docker compose up -d
services:
  db:
    image: imresamu/postgis:17-3.5 # multi-arch (Mac Apple Silicon), même contenu que postgis/postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
