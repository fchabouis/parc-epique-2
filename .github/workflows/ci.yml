name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get

      - name: Upload mix.lock
        uses: actions/upload-artifact@v4
        with:
          name: mix.lock
          path: mix.lock

      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - name: Build assets
        run: mix do assets.setup + assets.build
      - name: mix test
        run: mix test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Import the public 2022 Firebase export
        run: |
          mkdir -p tmp
          curl -sSfL -o tmp/base_repartage_2022_08_22.json https://raw.githubusercontent.com/fchabouis/parc-epique/master/base_repartage_2022_08_22.json
          mix test --only legacy_export 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      # Job logs are not always readable; repeat the failing output as an annotation.
      - name: Report test failures
        if: failure()
        run: |
          if [ -f test-output.txt ]; then
            body=$(grep -v '^\s*$' test-output.txt | tail -c 3500 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test output::${body}"
          fi
