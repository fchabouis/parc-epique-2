name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.18.4"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - run: mix deps.get

      - name: Upload mix.lock
        uses: actions/upload-artifact@v4
        with:
          name: mix.lock
          path: mix.lock

      - name: Compile
        run: mix compile --warnings-as-errors 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Check formatting
        run: mix format --check-formatted 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Build assets
        run: mix do assets.setup + assets.build
      - name: mix test
        run: mix test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Import the public 2022 Firebase export
        run: |
          mkdir -p tmp
          curl -sSfL -o tmp/base_repartage_2022_08_22.json https://raw.githubusercontent.com/fchabouis/parc-epique/master/base_repartage_2022_08_22.json
          mix test --only legacy_export 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      # Job logs are not always readable; repeat the failing output (compile, format or tests) as an annotation.
      - name: Report failures
        if: failure()
        run: |
          if [ -f test-output.txt ]; then
            body=$(grep -v '^\s*$' test-output.txt | tail -c 3500 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test output::${body}"
          fi

  # The production image builds and starts: migrations run and /health answers.
  docker:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: parc-epique:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE parc_epique_smoke'
          docker run -d --name smoke --network host \
            -e DATABASE_URL=ecto://postgres:postgres@localhost/parc_epique_smoke \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e PHX_HOST=localhost \
            parc-epique:ci
          docker exec smoke bin/migrate
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4000/health && break
            sleep 2
          done
          curl -fsS http://localhost:4000/health
          curl -fsS -o /dev/null http://localhost:4000/fr/a-propos
          curl -fsS http://localhost:4000/manifest.webmanifest | grep -q standalone

      - name: Container logs
        if: failure()
        run: |
          body=$(docker logs smoke 2>&1 | tail -c 3500 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Container logs::${body}"
